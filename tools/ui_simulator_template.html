<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词学习本 · 240×320 模拟器</title>
<style>
:root {
  --ink: #1c1917;
  --ink-soft: #57534e;
  --paper: #faf6ed;
  --paper-deep: #f0e9da;
  --line: #e4ddca;
  --line-strong: #cbbfa5;
  --accent: #b45309;
  --green: #166534;
  --green-bg: #dcfce7;
  --blue: #1e40af;
  --blue-bg: #dbeafe;
  --amber: #a16207;
  --amber-bg: #fef9c3;
  --plum: #7c3aed;
  --plum-bg: #ede9fe;
  --terracotta: #b45309;
  --terracotta-bg: #fef3c7;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --white: #fffdf7;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(circle at 20% 10%, #403a34, #211e1b 55%, #171412);
  color: #f5f1ea;
  font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  display: flex;
  justify-content: center;
  padding: 28px 18px;
}

.shell { width: min(960px, 100%); }

.toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.toolbar h1 {
  font-size: 20px;
  font-weight: 650;
  margin: 0 12px 0 0;
  letter-spacing: 0;
}
.tool-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 8px;
  padding: 7px 10px;
  color: #f5f1ea;
  font: inherit;
  cursor: pointer;
}
.tool-card:hover { background: rgba(255,255,255,.14); }
.tool-card:active { transform: translateY(1px); }
.tool-card.mini { padding: 7px 8px; }
.hint {
  margin-left: auto;
  font-size: 12px;
  color: #c9c0b4;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
kbd {
  background: #34302c;
  border: 1px solid #55504a;
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 2px 7px;
  font: 11px/1.4 Consolas, monospace;
  color: #fff;
}

.desk {
  display: flex;
  gap: 30px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.device {
  zoom: 1.35;
  margin: 0 auto;
  width: 276px;
  padding: 22px 18px 16px;
  background: linear-gradient(180deg, #2a2420, #151210 60%);
  border: 1px solid #4a423b;
  border-radius: 38px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.04);
}
.screen-frame {
  position: relative;
  width: 240px;
  height: 320px;
  margin: 0 auto;
  border-radius: 26px;
  overflow: hidden;
  background: #000;
  border: 3px solid #0c0a09;
  box-shadow: 0 0 0 1px #584d43, inset 0 0 18px rgba(0,0,0,.45);
}
.screen {
  width: 240px;
  height: 320px;
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  position: relative;
  font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  user-select: none;
}

.phys {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 68px;
  height: 58px;
  border: 1px solid #57504a;
  border-bottom-width: 4px;
  border-radius: 18px;
  background: linear-gradient(180deg, #4a423c, #2b2622);
  color: #f7f1e8;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 5px 0 #14100e;
  transition: transform .04s, box-shadow .04s, background .1s;
}
.phys:active, .phys.held {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #14100e;
  background: linear-gradient(180deg, #7a5c26, #4a3518);
}
.phys svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.phys .key-label { font-size: 11px; letter-spacing: .08em; color: #cfc6ba; }
.phys-label { font-size: 10px; color: #999187; margin-top: 9px; text-align: center; }
.buttons { display: flex; justify-content: space-between; margin-top: 14px; padding: 0 8px; }
.buttons .press { cursor: pointer; }

.state-panel {
  flex: 1 1 300px;
  min-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.state-block {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  padding: 12px 14px;
}
.state-block h2 {
  margin: 0 0 8px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #b8ad9f;
}
.state-line { font-size: 14px; line-height: 1.7; }
.state-line b { color: #ffe1a1; font-weight: 650; }
#eventLog {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 180px;
  overflow-y: auto;
  font-family: Consolas, monospace;
  font-size: 12px;
  color: #d8cfc2;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#eventLog li { border-left: 3px solid #7c5a37; padding-left: 8px; }
#eventLog li.act { border-color: #d8a45a; }

/* Screen UI */
.app-header {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--white);
  border-bottom: 2px solid var(--line);
  position: relative;
  z-index: 2;
}
.app-header .title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}
.app-header .side { display: flex; align-items: center; gap: 7px; }
.back-indicator { color: var(--ink-soft); font-size: 15px; }
.battery {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-weight: 700;
  color: var(--ink-soft);
}
.battery .charge {
  width: 16px;
  height: 8px;
  border: 1px solid var(--ink-soft);
  border-radius: 2px;
  padding: 1px;
  display: inline-flex;
}
.battery .charge i {
  display: block;
  width: var(--level, 75%);
  height: 100%;
  background: var(--green);
  border-radius: 1px;
}
.battery .charge::after {
  content: "";
  width: 1.5px;
  height: 3px;
  background: var(--ink-soft);
  margin-left: 1px;
  align-self: center;
  border-radius: 0 1px 1px 0;
}

.app-body {
  height: calc(320px - 36px);
  padding: 10px 10px 12px;
  position: relative;
}
.screen-footer {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  font-size: 10px;
  border-top: 1px dashed var(--line);
  background: var(--paper);
}

.progress-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: var(--ink-soft);
  margin-bottom: 7px;
}
.progress-track {
  flex: 1;
  height: 5px;
  border-radius: 3px;
  background: var(--paper-deep);
  margin-left: 8px;
  overflow: hidden;
}
.progress-track i {
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--accent);
  border-radius: 3px;
}

.menu-list, .option-list { display: flex; flex-direction: column; gap: 4px; }
.menu-row {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 9px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 650;
  color: var(--ink);
  overflow: hidden;
}
.menu-row .stripe {
  width: 5px;
  align-self: stretch;
  margin-left: -9px;
  border-radius: 0 4px 4px 0;
}
.menu-row .sub {
  margin-left: auto;
  font-size: 9px;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
}
.menu-row.selected {
  border-color: var(--ink);
  background: #fff8e8;
  box-shadow: inset 3px 0 0 var(--accent);
}
.menu-row.selected .stripe { display: none; }

.list-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 2px 0 7px;
}
.list-head .name { font-size: 14px; font-weight: 700; }
.list-head .count { font-size: 10px; color: var(--ink-soft); }
.word-row {
  display: flex;
  align-items: center;
  height: 34px;
  gap: 9px;
  padding: 0 9px;
  margin-bottom: 4px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.word-row.selected {
  border-color: var(--ink);
  background: var(--cat-bg, #fff8e8);
  box-shadow: inset 3px 0 0 var(--cat, var(--accent));
}
.word-row .idx {
  width: 24px;
  text-align: center;
  font-size: 9px;
  color: var(--ink-soft);
  background: var(--paper-deep);
  border-radius: 5px;
  padding: 2px 0;
}
.word-row .w { font-size: 13px; font-weight: 750; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.word-row .zh { margin-left: auto; font-size: 9px; color: var(--ink-soft); max-width: 105px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty {
  margin-top: 60px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 2;
}
.empty .big { color: var(--ink); font-size: 32px; font-weight: 300; }

.detail-scroll {
  height: 240px;
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
}
.detail-scroll::-webkit-scrollbar { display: none; }
.detail-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 2px 4px;
}
.detail-top .word-big {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 29px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.speaker {
  flex: none;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: var(--paper-deep);
  border: 1.5px solid var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}
.speaker.playing { background: var(--accent); color: #fff; }
.speaker svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.star {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--line-strong);
  background: var(--white);
  color: var(--line-strong);
  font-size: 15px;
}
.star.on { color: #eab308; border-color: #eab308; background: var(--amber-bg); }
.category-chip {
  align-self: flex-start;
  font-size: 8px;
  font-weight: 750;
  color: var(--cat, var(--ink));
  background: var(--cat-bg, var(--paper-deep));
  border: 1px solid var(--cat, var(--line-strong));
  border-radius: 9px;
  padding: 2px 7px;
  letter-spacing: .04em;
}
.detail-block { margin: 5px 0; }
.detail-block .label {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--ink-soft);
  margin-bottom: 2px;
}
.detail-block .text {
  font-size: 11px;
  line-height: 1.45;
  color: var(--ink);
}
.detail-block .text.zh {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
}
.detail-block .text.core {
  background: var(--paper-deep);
  border-left: 3px solid var(--accent);
  padding: 4px 7px;
  border-radius: 0 6px 6px 0;
}
.syn-line {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.syn-chip {
  font-size: 9px;
  color: var(--blue);
  background: var(--blue-bg);
  border-radius: 9px;
  padding: 2px 7px;
}

.card-stage {
  height: 214px;
  margin-top: 8px;
  border-radius: 14px;
  background: var(--white);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 5px var(--paper-deep), inset 0 0 0 6px var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  overflow: hidden;
}
.card-stage .front-word {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 35px;
  font-weight: 650;
  color: var(--ink);
  text-align: center;
  overflow-wrap: anywhere;
}
.card-stage .flip-hint { margin-top: 8px; font-size: 9px; color: var(--ink-soft); }
.card-stage .back-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 21px;
  font-weight: 650;
  text-align: center;
  color: var(--ink);
}
.card-stage .back-zh { font-size: 13px; font-weight: 700; margin-top: 4px; text-align: center; }
.card-stage .back-text { font-size: 10px; line-height: 1.45; color: var(--ink-soft); margin-top: 6px; text-align: center; }
.card-stage .back-ex { font-size: 10px; line-height: 1.45; color: var(--ink); margin-top: 6px; text-align: center; }
.dots { display: flex; gap: 3px; justify-content: center; margin-top: 9px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.dots i.on { background: var(--accent); }

.quiz-prompt {
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.4;
  padding: 6px 4px;
  border-bottom: 2px dashed var(--line);
  margin-bottom: 7px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  margin-bottom: 7px;
  padding: 0 9px;
  border: 1.5px solid var(--line);
  border-radius: 9px;
  background: var(--white);
  font-size: 14px;
  font-weight: 700;
}
.quiz-option .badge {
  width: 22px;
  height: 22px;
  flex: none;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-deep);
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
  font-size: 9px;
}
.quiz-option .badge svg { width: 12px; height: 12px; }
.quiz-option.selected { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.quiz-option.right { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.quiz-option.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.quiz-option.muted { opacity: .45; }
.quiz-feedback {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 750;
  color: var(--ink);
}
.quiz-feedback.right { color: var(--green); }
.quiz-feedback.wrong { color: var(--red); }

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 40px;
  padding: 0 10px;
  margin-bottom: 7px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
}
.stat-row b { font-size: 14px; }
.stat-row .tag {
  color: var(--white);
  background: var(--accent);
  border-radius: 8px;
  font-size: 8px;
  padding: 2px 7px;
}
.summary-hero {
  margin: 22px 0 14px;
  text-align: center;
}
.summary-hero .hero-big { font-size: 32px; font-weight: 750; color: var(--ink); }
.summary-hero .hero-sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

@media (max-width: 720px) {
  .device { zoom: 1; }
  .hint { margin-left: 0; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <h1>单词学习本 · 模拟器</h1>
    <button class="tool-card mini" id="zoomOut" type="button" aria-label="缩小">−</button>
    <span id="zoomValue" style="font-size:12px;color:#c9c0b4">1.35×</span>
    <button class="tool-card mini" id="zoomIn" type="button" aria-label="放大">+</button>
    <button class="tool-card" id="resetBtn" type="button">重置</button>
    <label class="tool-card"><input type="checkbox" id="speechToggle" checked> 发音</label>
    <div class="hint">
      <span>键盘：<kbd>↑</kbd><kbd>Enter</kbd><kbd>↓</kbd></span>
      <span>长按 <kbd>OK</kbd> 返回</span>
    </div>
  </div>

  <div class="desk">
    <div class="device" id="device">
      <div class="screen-frame">
        <div class="screen" id="screen"></div>
      </div>
      <div class="buttons">
        <button class="phys" id="btnUp" type="button" aria-label="UP 上">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <span class="key-label">UP</span>
        </button>
        <button class="phys" id="btnOk" type="button" aria-label="OK 确认，长按返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span class="key-label">OK</span>
        </button>
        <button class="phys" id="btnDown" type="button" aria-label="DOWN 下">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          <span class="key-label">DOWN</span>
        </button>
      </div>
      <div class="phys-label">240 × 320</div>
    </div>

    <aside class="state-panel">
      <section class="state-block">
        <h2>当前页面</h2>
        <div class="state-line" id="statePath">首页</div>
      </section>
      <section class="state-block">
        <h2>按键事件</h2>
        <ol id="eventLog"></ol>
      </section>
    </aside>
  </div>
</div>

<script>
const WORDS = __OGDEN_WORDS_JSON__;

const CATEGORIES = [
  { id: "all", zh: "全部单词", en: "All", count: 850, color: "#1c1917", bg: "#e9e2d4" },
  { id: "op", zh: "操作词", en: "Operations", count: 100, color: "#b45309", bg: "#fef3c7" },
  { id: "gt", zh: "通用词", en: "General Things", count: 400, color: "#166534", bg: "#dcfce7" },
  { id: "pt", zh: "图示词", en: "Picturable", count: 200, color: "#a16207", bg: "#fef9c3" },
  { id: "qg", zh: "性质词", en: "Qualities", count: 100, color: "#1e40af", bg: "#dbeafe" },
  { id: "qo", zh: "反义对", en: "Opposites", count: 50, color: "#7c3aed", bg: "#ede9fe" },
];

const MENU = [
  { title: "分类浏览", sub: "六类词库", accent: "#1c1917" },
  { title: "每日学习", sub: "10 词任务", accent: "#166534" },
  { title: "单词自测", sub: "三选一", accent: "#1e40af" },
  { title: "生词本", sub: "收藏单词", accent: "#b45309" },
  { title: "学习统计", sub: "累计进度", accent: "#7c3aed" },
  { title: "全部单词", sub: "850 词", accent: "#57534e" },
];

const ICONS = {
  up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  dot: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>',
  speaker: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  star: "★",
  back: "‹",
};

const state = {
  screen: "home",
  menuIndex: 0,
  categoryIndex: 0,
  listFrom: "browse",
  listCategory: "all",
  listSelected: 0,
  listOffset: 0,
  detailIndex: 0,
  detailScrollTop: 0,
  study: { deck: [], pos: 0, revealed: false },
  quiz: { items: [], pos: 0, answered: false, chosen: -1, done: false },
  starred: new Set(),
  status: new Uint8Array(WORDS.length),
  studied: 0,
  quizAnswered: 0,
  quizCorrect: 0,
  weaknesses: new Set(),
};

let zoom = 1.35;
let okTimer = null;
let okLongFired = false;
let detailTapTimer = null;
let logCount = 0;

const screenEl = document.getElementById("screen");
const statePathEl = document.getElementById("statePath");
const eventLogEl = document.getElementById("eventLog");
const speechToggleEl = document.getElementById("speechToggle");

function categoryMeta(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
}

function wordsForCategory(id) {
  if (id === "all") return WORDS.map((w, i) => ({ ...w, i }));
  return WORDS.map((w, i) => ({ ...w, i })).filter(w => w.c === id);
}

function listForCurrent() {
  return wordsForCategory(state.listCategory);
}

function log(action, detail) {
  const li = document.createElement("li");
  if (action) li.className = "act";
  const time = String(++logCount).padStart(2, "0");
  li.textContent = `${time}  ${detail}`;
  eventLogEl.prepend(li);
  while (eventLogEl.children.length > 14) eventLogEl.lastChild.remove();
}

function setPath(text) {
  statePathEl.innerHTML = "";
  statePathEl.appendChild(document.createTextNode(text));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function icon(name, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.innerHTML = ICONS[name] || "";
  return span;
}

function clearScreen() {
  screenEl.innerHTML = "";

function header(title, back = false) {
  const hdr = el("div", "app-header");
  const left = el("div", "side");
  if (back) left.appendChild(icon("back", "back-indicator"));
  left.appendChild(el("span", "title", title));
  hdr.appendChild(left);
  hdr.appendChild(battery());
  return hdr;
}

function battery() {
  const wrap = el("div", "battery");
  const charge = el("span", "charge");
  charge.style.setProperty("--level", "72%");
  charge.appendChild(el("i"));
  wrap.appendChild(charge);
  wrap.appendChild(document.createTextNode("72%"));
  return wrap;
}

function speak(text) {
  if (!speechToggleEl.checked || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.82;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

function startStudy() {
  state.study.deck = WORDS.slice(0, 10).map((w, i) => ({ ...w, i }));
  state.study.pos = 0;
  state.study.revealed = false;
}

function startQuiz() {
  const pool = [...WORDS.keys()].sort(() => Math.random() - 0.5).slice(0, 10);
  const items = pool.map(correctIndex => {
    const correct = WORDS[correctIndex];
    const others = [...WORDS.keys()].filter(i => i !== correctIndex).sort(() => Math.random() - 0.5).slice(0, 2).map(i => WORDS[i]);
    const options = [correct, ...others].sort(() => Math.random() - 0.5);
    return { word: correct, options, answer: options.indexOf(correct) };
  });
  state.quiz.items = items;
  state.quiz.pos = 0;
  state.quiz.answered = false;
  state.quiz.chosen = -1;
  state.quiz.done = false;
}

function handleUp() {
  if (state.screen === "home") {
    state.menuIndex = (state.menuIndex + MENU.length - 1) % MENU.length;
    log(true, "上：首页选择 " + MENU[state.menuIndex].title);
  } else if (state.screen === "categories") {
    state.categoryIndex = (state.categoryIndex + CATEGORIES.length - 1) % CATEGORIES.length;
    log(true, "上：分类 " + CATEGORIES[state.categoryIndex].zh);
  } else if (state.screen === "list" || state.screen === "collection") {
    const list = state.screen === "list" ? listForCurrent() : WORDS.map((w, i) => ({ ...w, i })).filter(w => state.starred.has(w.i));
    if (list.length) {
      state.listSelected = (state.listSelected + list.length - 1) % list.length;
      state.listOffset = Math.max(0, Math.min(state.listOffset, state.listSelected - 5));
      log(true, `上：${list[state.listSelected].w}`);
    }
  } else if (state.screen === "detail") {
    const scroll = screenEl.querySelector(".detail-scroll");
    if (scroll && scroll.scrollTop > 4) {
      scroll.scrollTop = Math.max(0, scroll.scrollTop - 36);
      state.detailScrollTop = scroll.scrollTop;
      log(true, "上：详情向上滚动");
    } else {
      const list = listForCurrent();
      if (list.length) {
        state.detailIndex = (state.detailIndex + list.length - 1) % list.length;
        state.detailScrollTop = 0;
        log(true, "上：前一词 " + list[state.detailIndex].w);
      }
    }
  } else if (state.screen === "study") {
    if (state.study.pos > 0) {
      state.study.pos--;
      state.study.revealed = false;
      log(true, "上：上一卡");
    }
  } else if (state.screen === "quiz" && !state.quiz.answered) {
    chooseQuiz(0);
  }
  render();
}

function handleDown() {
  if (state.screen === "home") {
    state.menuIndex = (state.menuIndex + 1) % MENU.length;
    log(true, "下：首页选择 " + MENU[state.menuIndex].title);
  } else if (state.screen === "categories") {
    state.categoryIndex = (state.categoryIndex + 1) % CATEGORIES.length;
    log(true, "下：分类 " + CATEGORIES[state.categoryIndex].zh);
  } else if (state.screen === "list" || state.screen === "collection") {
    const list = state.screen === "list" ? listForCurrent() : WORDS.map((w, i) => ({ ...w, i })).filter(w => state.starred.has(w.i));
    if (list.length) {
      state.listSelected = (state.listSelected + 1) % list.length;
      state.listOffset = Math.max(0, Math.min(state.listOffset, state.listSelected - 5));
      log(true, `下：${list[state.listSelected].w}`);
    }
  } else if (state.screen === "detail") {
    const scroll = screenEl.querySelector(".detail-scroll");
    if (scroll && scroll.scrollTop + scroll.clientHeight < scroll.scrollHeight - 4) {
      scroll.scrollTop = Math.min(scroll.scrollHeight, scroll.scrollTop + 36);
      state.detailScrollTop = scroll.scrollTop;
      log(true, "下：详情向下滚动");
    } else {
      const list = listForCurrent();
      if (list.length) {
        state.detailIndex = (state.detailIndex + 1) % list.length;
        state.detailScrollTop = 0;
        log(true, "下：后一词 " + list[state.detailIndex].w);
      }
    }
  } else if (state.screen === "study") {
    if (state.study.pos < state.study.deck.length - 1) {
      state.study.pos++;
      state.study.revealed = false;
      log(true, "下：下一卡");
    } else {
      finishStudy();
    }
  } else if (state.screen === "quiz") {
    if (!state.quiz.answered) chooseQuiz(2);
    else replayQuizWord();
  }
  render();
}

function chooseQuiz(index) {
  const item = state.quiz.items[state.quiz.pos];
  state.quiz.chosen = index;
  state.quiz.answered = true;
  state.quizAnswered++;
  const correct = index === item.answer;
  if (correct) {
    state.quizCorrect++;
    state.status[item.word.i] = 2;
  } else {
    state.status[item.word.i] = 1;
    state.weaknesses.add(item.word.i);
  }
  speak(item.word.w);
  log(true, `${correct ? "正确" : "错误"}：${item.word.w}`);
}

function replayQuizWord() {
  const item = state.quiz.items[state.quiz.pos];
  speak(item.word.w);
  log(true, "重听：" + item.word.w);
}

function handleOk() {
  if (state.screen === "home") {
    const action = state.menuIndex;
    if (action === 0) {
      state.screen = "categories";
      state.categoryIndex = 0;
      log(true, "OK：进入分类浏览");
    } else if (action === 1) {
      startStudy();
      state.screen = "study";
      log(true, "OK：开始每日学习");
    } else if (action === 2) {
      startQuiz();
      state.screen = "quiz";
      log(true, "OK：开始单词自测");
    } else if (action === 3) {
      state.screen = "collection";
      state.listSelected = 0;
      state.listOffset = 0;
      log(true, "OK：进入生词本");
    } else if (action === 4) {
      state.screen = "stats";
      log(true, "OK：进入学习统计");
    } else {
      state.listFrom = "all";
      state.listCategory = "all";
      state.screen = "list";
      state.listSelected = 0;
      state.listOffset = 0;
      log(true, "OK：全部单词");
    }
    render();
    return;
  }

  if (state.screen === "categories") {
    state.listFrom = "browse";
    state.listCategory = CATEGORIES[state.categoryIndex].id;
    state.screen = "list";
    state.listSelected = 0;
    state.listOffset = 0;
    log(true, "OK：进入 " + CATEGORIES[state.categoryIndex].zh);
    render();
    return;
  }

  if (state.screen === "list" || state.screen === "collection") {
    const list = state.screen === "list" ? listForCurrent() : WORDS.map((w, i) => ({ ...w, i })).filter(w => state.starred.has(w.i));
    if (!list.length) return;
    state.screen = "detail";
    state.detailIndex = list.findIndex(w => w.i === list[state.listSelected].i);
    state.detailScrollTop = 0;
    log(true, "OK：打开详情 " + list[state.listSelected].w);
    render();
    return;
  }

  if (state.screen === "detail") {
    if (detailTapTimer) {
      clearTimeout(detailTapTimer);
      detailTapTimer = null;
      const word = listForCurrent()[state.detailIndex];
      if (state.starred.has(word.i)) state.starred.delete(word.i);
      else state.starred.add(word.i);
      log(true, "双击 OK：" + (state.starred.has(word.i) ? "收藏" : "取消收藏") + " " + word.w);
      render();
      return;
    }
    detailTapTimer = setTimeout(() => {
      detailTapTimer = null;
      const word = listForCurrent()[state.detailIndex];
      speak(word.w);
      log(true, "OK：发音 " + word.w);
      const speaker = screenEl.querySelector(".speaker");
      if (speaker) speaker.classList.add("playing");
    }, 280);
    return;
  }

  if (state.screen === "study") {
    const card = state.study.deck[state.study.pos];
    if (!state.study.revealed) {
      state.study.revealed = true;
      state.status[card.i] = Math.max(1, state.status[card.i]);
      state.studied++;
      speak(card.w);
      log(true, "OK：翻面并发音 " + card.w);
    } else {
      speak(card.w);
      log(true, "OK：重听 " + card.w);
    }
    render();
    return;
  }

  if (state.screen === "quiz") {
    const item = state.quiz.items[state.quiz.pos];
    if (!state.quiz.answered) {
      chooseQuiz(1);
    } else if (state.quiz.pos < state.quiz.items.length - 1) {
      state.quiz.pos++;
      state.quiz.answered = false;
      state.quiz.chosen = -1;
      log(true, "OK：下一题");
    } else {
      state.quiz.done = true;
      log(true, "OK：自测完成");
    }
    render();
    return;
  }

  if (state.screen === "studyDone" || state.screen === "quizDone") {
    state.screen = "home";
    log(true, "OK：返回首页");
    render();
    return;
  }
}

function finishStudy() {
  state.screen = "studyDone";
  log(true, "每日学习完成");
  render();
}

function handleBack() {
  log(true, "长按 OK：返回上一级");
  if (state.screen === "home") {
    log(false, "已在首页");
    return;
  }
  if (state.screen === "categories" || state.screen === "study" || state.screen === "quiz" ||
      state.screen === "collection" || state.screen === "stats" ||
      state.screen === "studyDone" || state.screen === "quizDone") {
    state.screen = "home";
  } else if (state.screen === "list") {
    if (state.listFrom === "all") state.screen = "home";
    else state.screen = "categories";
  } else if (state.screen === "detail") {
    state.screen = state.detailBack || "list";
  }
  render();
}

function render() {
  switch (state.screen) {
    case "home": renderHome(); break;
    case "categories": renderCategories(); break;
    case "list": renderWordList(); break;
    case "detail": renderDetail(); break;
    case "study": renderStudy(); break;
    case "studyDone": renderStudyDone(); break;
    case "quiz": renderQuiz(); break;
    case "quizDone": renderQuiz(); break;
    case "collection": renderCollection(); break;
    case "stats": renderStats(); break;
    default: renderHome();
  }
}

function resetSimulator() {
  state.screen = "home";
  state.menuIndex = 0;
  state.categoryIndex = 0;
  state.listSelected = 0;
  state.listOffset = 0;
  state.detailIndex = 0;
  state.starred.clear();
  state.status.fill(0);
  state.studied = 0;
  state.quizAnswered = 0;
  state.quizCorrect = 0;
  state.weaknesses.clear();
  eventLogEl.innerHTML = "";
  logCount = 0;
  log(false, "模拟器已重置");
  render();
}

function pressOkLong() {
  okTimer = null;
  if (!okLongFired) {
    okLongFired = true;
    handleBack();
  }
}

function pressOkClick() {
  okTimer = null;
  if (okLongFired) {
    okLongFired = false;
    return;
  }
  handleOk();
}

function bindLongPress(button, longFn, clickFn) {
  let timer = null;
  let fired = false;
  const start = event => {
    event.preventDefault();
    fired = false;
    button.classList.add("held");
    timer = setTimeout(() => {
      fired = true;
      timer = null;
      longFn();
      button.classList.remove("held");
    }, 620);
  };
  const end = () => {
    button.classList.remove("held");
    if (timer) {
      clearTimeout(timer);
      timer = null;
      if (!fired) clickFn();
    }
  };
  button.addEventListener("pointerdown", start);
  button.addEventListener("pointerup", end);
  button.addEventListener("pointerleave", end);
}

document.getElementById("btnUp").addEventListener("click", () => {
  handleUp();
  log(false, "按键 UP");
});
document.getElementById("btnDown").addEventListener("click", () => {
  handleDown();
  log(false, "按键 DOWN");
});
bindLongPress(document.getElementById("btnOk"), pressOkLong, pressOkClick);

document.addEventListener("keydown", event => {
  if (event.key === "ArrowUp") {
    event.preventDefault();
    handleUp();
    log(false, "键盘 ↑");
  } else if (event.key === "ArrowDown") {
    event.preventDefault();
    handleDown();
    log(false, "键盘 ↓");
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    if (event.repeat) return;
    okLongFired = false;
    document.getElementById("btnOk").classList.add("held");
    okTimer = setTimeout(pressOkLong, 620);
  }
});
document.addEventListener("keyup", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    document.getElementById("btnOk").classList.remove("held");
    if (okTimer) {
      clearTimeout(okTimer);
      okTimer = null;
      if (!okLongFired) {
        handleOk();
        log(false, "键盘 OK");
      }
      okLongFired = false;
    } else {
      okLongFired = false;
    }
  }
});

document.getElementById("zoomIn").addEventListener("click", () => {
  zoom = Math.min(2.2, zoom + 0.15);
  applyZoom();
});
document.getElementById("zoomOut").addEventListener("click", () => {
  zoom = Math.max(0.9, zoom - 0.15);
  applyZoom();
});
function applyZoom() {
  document.getElementById("device").style.zoom = String(zoom);
  document.getElementById("zoomValue").textContent = zoom.toFixed(2) + "×";
}
document.getElementById("resetBtn").addEventListener("click", resetSimulator);

render();
log(false, "模拟器就绪：完整 850 词");
</script>
</body>
</html>
